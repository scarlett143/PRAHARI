name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q

  bridge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    env:
      # Only the `github` context is available in job-level env -- `runner` is not.
      PYTHONPATH: ${{ github.workspace }}/backend
      DATABASE_URL: sqlite+aiosqlite:///${{ github.workspace }}/prahari_bridge_test.db
      JWT_SECRET: ci-only-secret-long-enough-for-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            bridge/requirements.txt
            backend/requirements.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Vite 7 requires >= 20.19; Node 18 fails at dev-server startup.
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --no-audit --no-fund
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t prahari-backend ./backend
      - name: Build frontend image
        run: docker build -t prahari-frontend ./frontend
      - name: Build bridge image
        run: docker build -f bridge/Dockerfile -t prahari-bridge .
