server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed asset filenames are immutable; index.html must never be cached or
    # clients keep loading an old bundle after a deploy.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # The API is served from this same origin.
    #
    # Keeping the browser on one origin is what makes a single tunnelled or proxied URL
    # work: there is no cross-origin preflight to satisfy, and no API hostname baked into
    # the bundle at build time that has to match wherever the app is later deployed.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Envelopes are small, but a burst of them should not be buffered to disk.
        proxy_request_buffering off;
    }

    location = /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
    }

    # The realtime link. Without the Upgrade headers nginx would answer the handshake
    # itself and the socket would never reach the application.
    location /ws {
        proxy_pass http://backend:8000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A quiet channel must outlive nginx's default 60s read timeout; the client's
        # own keepalive frame is every 25s, so this only trips on a genuinely dead link.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Single-page app: unknown paths resolve to the shell, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # All cryptography runs in the browser, so the bundle's integrity is the
    # whole security boundary. Keep the origin tight.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
