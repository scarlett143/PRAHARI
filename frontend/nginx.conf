server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed asset filenames are immutable; index.html must never be cached or
    # clients keep loading an old bundle after a deploy.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Single-page app: unknown paths resolve to the shell, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # All cryptography runs in the browser, so the bundle's integrity is the
    # whole security boundary. Keep the origin tight.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
