# Security headers, kept in one file because nginx does NOT merge add_header across
# levels: a location that declares any add_header of its own silently drops every one
# inherited from the server block. The caching locations below each set Cache-Control,
# so without an explicit include there they would serve the app shell and the bundle
# with no CSP at all -- precisely where it matters most.
#
# Include this in the server block AND in every location that sets its own add_header.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;

# Content Security Policy.
#
# The threat model is explicit that private keys in IndexedDB are safe from the server
# but not from malicious JavaScript in this origin -- XSS defeats them. This is the
# mitigation: no inline script, no eval, and nowhere off-origin to send anything even if
# injection succeeds.
#
# `connect-src 'self'` is what makes exfiltration hard. With the API on this same origin,
# injected code has no legitimate reason to talk anywhere else, so it can be forbidden
# outright rather than allow-listed. Same reasoning for form-action.
#
# Vite emits no inline script for the app bundle, so 'unsafe-inline' is not needed for
# script-src. If a future build step adds one, give it a nonce rather than relaxing this.
# style-src keeps 'unsafe-inline' because the app sets inline style attributes.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; upgrade-insecure-requests" always;

# The app needs no camera, microphone, geolocation or payment access. Denying them up
# front means injected code cannot prompt for them either.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
